<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

    <div th:replace="~{head :: head}"></div>

<body>
 <div th:replace="~{header :: header}"></div>
 

       <div class="container" style="margin-top: 100px; margin-bottom: 100px;">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4 p-sm-5">
                        
                        <div class="text-center mb-4">
                            <h2 class="fw-bold mb-1">Welcome Back</h2>
                            <p class="text-muted">Please sign in to your account</p>
                        </div>

                        <form>
                            <div class="form-floating mb-3">
                                <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com" required>
                                <label for="floatingInput">Email address</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="password" class="form-control" id="floatingPassword" placeholder="Password" required>
                                <label for="floatingPassword">Password</label>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="rememberMe">
                                    <label class="form-check-label text-muted small" for="rememberMe">Remember me</label>
                                </div>
                                <a href="#" class="text-decoration-none small">Forgot password?</a>
                            </div>

                            <button class="w-100 btn btn-lg btn-primary rounded-pill mb-3" type="submit">Sign In</button>

                            <p class="text-center text-muted small mb-0">
                                Don't have an account? <a th:href="@{/user/form}" class="fw-semibold text-decoration-none">Create One</a>
                            </p>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <div th:replace="~{footer :: footer}"></div>
    <div th:replace="~{js :: js}"></div>

</body>
</html>
