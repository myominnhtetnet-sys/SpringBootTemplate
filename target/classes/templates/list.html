<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{head :: head}"></div>
<body>
<div th:replace="~{header :: header}"></div>


<main class="container" style="margin-top: 100px; margin-bottom: 100px;">
        <h2 class="mb-4">Programming Languages</h2>
        <div class="row">
            <!-- Loop through the list to create a card for each item -->
            <div class="col-md-4" th:each="lang : ${list}">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${lang}">Language</h5>
                        <p class="card-text">This is a description card for <span th:text="${lang}"></span>.</p>
                        <a href="#" class="btn btn-primary">Learn More</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

<div th:replace="~{footer :: footer}"></div>
    <div th:replace="~{js :: js}"></div>

</body>
</html>
