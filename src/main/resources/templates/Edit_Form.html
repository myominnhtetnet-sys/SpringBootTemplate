<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

    <div th:replace="~{head :: head}"></div>

<body>
 <div th:replace="~{header :: header}"></div>
 

       <div class="container" style="margin-top: 12%; margin-bottom: 100px;">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                
                <div class="card shadow-sm border-1 rounded-4">
                    <div class="card-body p-4 p-sm-5">
                        
                        <div class="text-center mb-4">
                            <h2 class="fw-bold mb-1">Edit Form</h2>
                        </div>

                        <form th:action="@{/user/update}" method="post" th:object="${userObj}">
                        <input type="hidden" th:field="*{id}" class="form-control"/>
                            <div class="form-floating mb-3">
                                <input type="text" th:field="*{name}" class="form-control">
                                <label >Name</label>
                            </div>
                            
                            <div class="form-floating mb-3">
                                <input type="email" th:field="*{email}" class="form-control" readonly>
                                <label >Email address</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="text" th:field="*{phoneNo}" class="form-control" >
                                <label >ph - No</label>
                            </div>
                            <div class="form-floating mb-3">
                                <textarea class="form-control" th:field="*{address}"></textarea>
                                <label >Address</label>
                            </div>

                            <button class="w-100 btn btn-lg btn-primary rounded-pill mb-3" type="submit">Update</button>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <div th:replace="~{footer :: footer}"></div>
    <div th:replace="~{js :: js}"></div>

</body>
</html>
