<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{head :: head}"></div>
<body>
<div th:replace="~{header :: header}"></div>

<div class="container" style="margin-top: 12%; margin-bottom: 5%;">

        <table class="table">
			<thead>
				<tr>
					<th>ID</th>
					<th>UserName</th>
					<th>Email</th>
					<th>Phone Number</th>
					<th>Address</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="user,index : ${users}">
					<td th:text="${index.count}"></td>
					<td th:text="${user.name}"></td>
					<td th:text="${user.email}"></td>
					<td th:text="${user.phoneNo}"></td> 
					<td th:text="${user.address}"></td>
					<td>
						<a th:href="@{/user/edit/{id}(id=${user.id})}" class="btn btn-primary">Edit</a>
						<form th:action="@{/user/delete/{id}(id=${user.id})}" method="post" style="display:inline;">
            <button type="submit" class="btn btn-danger" onclick="return confirm('Do you want to delete this user?');">Delete</button>
        </form>
						<!-- <a th:href="@{/user/delete/{id}(id=${user.id})}" class="btn btn-danger" onclick="return confirm('Do you want to delete this user?');">Delete</a> -->
					</td>
				</tr>
			</tbody>
			</table>
    </div>

<div th:replace="~{footer :: footer}"></div>
<div th:replace="~{js :: js}"></div>

</body>
</html>
