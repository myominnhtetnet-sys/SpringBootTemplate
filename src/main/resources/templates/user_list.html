<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{head :: head}"></div>
<body>
<div th:replace="~{header :: header}"></div>

<div class="container" style="margin-top: 12%; margin-bottom: 5%;">
    <table class="table">
        <thead>
            <tr>
                <th>ID</th>
                <th>UserName</th>
                <th>Email</th>
                <th>Phone Number</th>
                <th>Address</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="user,index : ${users}">
                <td th:text="${index.count}"></td>
                <td th:text="${user.name}"></td>
                <td th:text="${user.email}"></td>
                <td th:text="${user.phoneNo}"></td> 
                <td th:text="${user.address}"></td>
                <td>
                    <!-- Edit Button triggers the Modal and passes data attributes -->
                    <button type="button" class="btn btn-primary btn-sm" 
                            data-bs-toggle="modal" 
                            data-bs-target="#editUserModal"
                            th:data-id="${user.id}"
                            th:data-name="${user.name}"
                            th:data-email="${user.email}"
                            th:data-phone="${user.phoneNo}"
                            th:data-address="${user.address}">
                        Edit
                    </button>
                    
                    <!-- Delete Form -->
                    <form th:action="@{/user/delete/{id}(id=${user.id})}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Do you want to delete this user?');">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<!-- Edit User Modal Box -->
<div class="modal fade" id="editUserModal">
    <div class="modal-dialog mb-5">
        <div class="modal-content">
            <form th:action="@{/user/update}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title" id="editUserModalLabel">Edit User</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <!-- Hidden ID field -->
                    <input type="hidden" id="editId" name="id">

                    <div class="mb-3">
                        <label for="editName" class="form-label">UserName</label>
                        <input type="text" class="form-control" id="editName" name="name" required>
                    </div>

                    <div class="mb-3">
                        <label for="editEmail" class="form-label">Email</label>
                        <input type="email" class="form-control" id="editEmail" name="email" readonly>
                    </div>

                    <div class="mb-3">
                        <label for="editPhone" class="form-label">Phone Number</label>
                        <input type="text" class="form-control" id="editPhone" name="phoneNo" required>
                    </div>

                    <div class="mb-3">
                        <label for="editAddress" class="form-label">Address</label>
                        <input type="text" class="form-control" id="editAddress" name="address" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{footer :: footer}"></div>
<div th:replace="~{js :: js}"></div>

<!-- Script to populate modal fields on edit button click -->
<script th:src="@{/js/model.js}"></script>

</body>
</html>
